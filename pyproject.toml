[project]
name = "nextkalaapi"
version = "0.1.0"
description = "Backend of nextkala project"
readme = "README.md"
authors = [
    { name = "khosraviTech", email = "khosravitech@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "sqlalchemy-pydantic-codegen>=1.1.1",
]

[project.scripts]
nextkalaapi = "nextkalaapi:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
